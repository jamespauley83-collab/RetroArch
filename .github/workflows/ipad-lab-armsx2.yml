name: ARMSX2 iOS core prototype
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pkg/apple/ipad-lab/experiments/armsx2/**'
      - '.github/workflows/ipad-lab-armsx2.yml'
permissions:
  contents: read
concurrency:
  group: armsx2-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    if: github.repository == 'jamespauley83-collab/RetroArch'
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        stage: [build-probe, device-test]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ARMSX2/ARMSX2
          ref: e58489d349cdcd635fc6264546087e347c84bf8c
          path: .armsx2-prototype/source
          persist-credentials: false
      - name: Test artifact validation
        run: python3 -m unittest discover -s pkg/apple/ipad-lab/experiments/armsx2 -p 'test_*.py' -v
      - name: Build isolated iOS core probe
        run: bash pkg/apple/ipad-lab/experiments/armsx2/build.sh "${{ matrix.stage }}"
      - name: Package isolated device-test app
        if: matrix.stage == 'device-test'
        run: python3 -u pkg/apple/ipad-lab/experiments/armsx2/package_device_app.py
      - name: Upload verified core, app if applicable, and sources
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-iOS-${{ matrix.stage }}-${{ github.sha }}
          path: .armsx2-prototype/artifacts/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-iOS-diagnostics-${{ matrix.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .armsx2-prototype/*.log
            .armsx2-prototype/build/CMakeCache.txt
            .armsx2-prototype/build/CMakeFiles/CMakeConfigureLog.yaml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
