name: Cancel redundant Lab PR checks
on:
  push:
    branches: [codex/ipad-lab-builtin-jit]
    paths: ['.github/workflows/lab-cancel-duplicate-checks.yml']
permissions: {}
jobs:
  cleanup:
    if: github.repository == 'jamespauley83-collab/RetroArch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...context.repo, branch: 'codex/ipad-lab-builtin-jit', per_page: 100
            });
            for (const run of runs) {
              if (run.event !== 'pull_request' || run.head_branch !== 'codex/ipad-lab-builtin-jit' || run.status === 'completed') continue;
              await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id})
                .then(() => core.info('Cancelled redundant PR run ' + run.id))
                .catch(error => { if (error.status !== 409) throw error; });
            }
