name: RetroArch Lab iPad

on:
  workflow_dispatch:
    inputs:
      with_stikjit:
        description: Embed built-in StikJIT (requires with_armsx2)
        type: boolean
        default: false
      with_armsx2:
        description: Include ARMSX2 as the preferred PS2 core alongside Play!
        type: boolean
        default: false
  push:
    branches: [codex/ipad-retroarch-lab, codex/ipad-lab-builtin-jit]
    paths:
      - 'pkg/apple/ipad-lab/**'
      - 'ui/drivers/cocoa/**'
      - 'ui/drivers/ui_cocoatouch.m'
      - 'griffin/griffin_objc.m'
      - 'network/cloud_sync/icloud_drive.m'
      - 'samples/network/icloud_drive/**'
      - '.github/workflows/ipad-lab.yml'
  pull_request:
    paths:
      - 'pkg/apple/ipad-lab/**'
      - 'ui/drivers/cocoa/**'
      - 'ui/drivers/ui_cocoatouch.m'
      - 'griffin/griffin_objc.m'
      - 'network/cloud_sync/icloud_drive.m'
      - 'samples/network/icloud_drive/**'
      - '.github/workflows/ipad-lab.yml'

permissions:
  contents: read

concurrency:
  group: ipad-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'jamespauley83-collab/RetroArch' && (github.event_name != 'pull_request' || github.head_ref != 'codex/ipad-lab-builtin-jit')
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select Xcode 26 for ARMSX2
        if: github.event_name == 'pull_request' || inputs.with_armsx2 || github.ref == 'refs/heads/codex/ipad-lab-builtin-jit'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Install XcodeGen for the JIT helper
        if: inputs.with_stikjit || github.ref == 'refs/heads/codex/ipad-lab-builtin-jit'
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Validate build inputs and packaging checks
        run: |
          python3 pkg/apple/ipad-lab/build.py --check
          python3 -m unittest discover -s pkg/apple/ipad-lab/tests -v
      - name: Test native library helpers and type-check the iOS screen
        run: bash pkg/apple/ipad-lab/tests/check_library.sh
      - name: Test default and Lab iCloud Drive containers
        working-directory: samples/network/icloud_drive
        run: |
          make check
          make clean
          make check ICLOUD_DRIVE_CONTAINER=iCloud.com.jamespauley.retroarchlab
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request' || inputs.with_armsx2 || github.ref == 'refs/heads/codex/ipad-lab-builtin-jit'
        with:
          repository: ARMSX2/ARMSX2
          ref: e58489d349cdcd635fc6264546087e347c84bf8c
          path: .armsx2-prototype/source
          persist-credentials: false
      - name: Build and validate the optional ARMSX2 core
        if: github.event_name == 'pull_request' || inputs.with_armsx2 || github.ref == 'refs/heads/codex/ipad-lab-builtin-jit'
        run: |
          python3 -m unittest discover -s pkg/apple/ipad-lab/experiments/armsx2 -p 'test_*.py' -v
          bash pkg/apple/ipad-lab/experiments/armsx2/build.sh device-test
      - name: Build cores and iPad app
        env:
          WITH_STIKJIT: ${{ inputs.with_stikjit || github.ref == 'refs/heads/codex/ipad-lab-builtin-jit' }}
          WITH_ARMSX2: ${{ github.event_name == 'pull_request' || inputs.with_armsx2 || github.ref == 'refs/heads/codex/ipad-lab-builtin-jit' }}
        run: |
          args=()
          if [ "$WITH_ARMSX2" = true ]; then args+=(--with-armsx2); fi
          if [ "$WITH_STIKJIT" = true ]; then args+=(--with-stikjit); fi
          python3 -u pkg/apple/ipad-lab/build.py "${args[@]}"
      - name: Package separate eight-core device-test copy
        if: github.event_name == 'pull_request' || inputs.with_armsx2 || github.ref == 'refs/heads/codex/ipad-lab-builtin-jit'
        run: |
          for artifact_dir in .ipad-lab-build/*/artifacts; do
            python3 pkg/apple/ipad-lab/package_eight_core_test.py "$artifact_dir" "$artifact_dir/eight-core-test"
          done
      - name: Upload unsigned IPA, sources, and manifest
        uses: actions/upload-artifact@v4
        with:
          name: RetroArch-Lab-iPad-${{ github.sha }}
          path: .ipad-lab-build/*/artifacts/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RetroArch-Lab-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ipad-lab-build/*/*.log
            .armsx2-prototype/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

